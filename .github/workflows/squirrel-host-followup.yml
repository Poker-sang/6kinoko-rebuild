name: Squirrel host contract correction
on:
  push:
    branches: ['refactor/squirrel222-native-cpp-20260918']
    paths: ['.github/workflows/squirrel-host-followup.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'Poker-sang/6kinoko-rebuild' && github.ref == 'refs/heads/refactor/squirrel222-native-cpp-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply only checksum-verified source edits
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          edits = {
            'tests/squirrel_host_object_contract.cpp': (
              '13602f60b6bd03f7a61569093be5e771a0a70669ac8395faac30fb79c034ecb2',
              'b6819d4a347269992b98d5782cfe152adb5dfe919267c924d712c55362e4b76f', [
              ('    while (vm->_top < vm->_stack.size()) sq_pushinteger(vm, 17);',
               '    while (static_cast<SQUnsignedInteger>(vm->_top) < vm->_stack.size()) sq_pushinteger(vm, 17);'),
              ('    require(SQ_SUCCEEDED(sq_getinteger(vm, -1, &result)) && result == 21, "native argument result");\n    sq_pop(vm, 1);',
               '    require(SQ_SUCCEEDED(sq_getinteger(vm, -1, &result)) && result == 21, "native argument result");\n    // 2.2.2 sq_call pops its arguments, but retains the called closure.\n    require_top(vm, top + 2, "source call leaves closure and result");\n    require(sq_gettype(vm, -2) == OT_CLOSURE, "called closure retained");\n    sq_pop(vm, 2);')]),
            'src/squirrel/squirrel_host_compat.cpp': (
              '7ca04a650c2f56d4f18f7dab879e4b98126ff48bc4e9b43485c4ff225464abf5',
              '0535d7d84f7fee416e4e28765f0d3e44c5f81572088cccc5379cd2c9a828e078', [
              ('if (vm->_top >= vm->_stack.size())', 'if (static_cast<SQUnsignedInteger>(vm->_top) >= vm->_stack.size())'),
              ('retdec_trace_i32("4a9d30:value", *tag);', 'retdec_trace_i32("4a9d30:value", result ? address(native_tag) : 0);'),
              ('extern "C" int32_t function_4aa080(int32_t object, int32_t key, int32_t output, int32_t tag_output) {\n    int32_t result = 0;',
               'extern "C" int32_t function_4aa080(int32_t object, int32_t key, int32_t output, int32_t tag_output) {\n    int32_t result = 0;\n    bool converted = false;'),
              ('        retdec_trace_i32("4aa080:read", read_userdata(vm, pointer<int32_t>(output), tag_output));',
               '        const auto conversion = read_userdata(vm, pointer<int32_t>(output), tag_output);\n        converted = SQ_SUCCEEDED(conversion);\n        retdec_trace_i32("4aa080:read", conversion);'),
              ('retdec_trace_i32("4aa080:out-value", output ? *pointer<int32_t>(output) : 0);',
               'retdec_trace_i32("4aa080:out-value", converted && output ? *pointer<int32_t>(output) : 0);')])
          }
          outputs = {}
          for name, (before, after, replacements) in edits.items():
              data = pathlib.Path(name).read_bytes()
              if hashlib.sha256(data).hexdigest() != before:
                  raise RuntimeError('Source changed: ' + name)
              text = data.decode('utf-8')
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise RuntimeError('Unexpected match count')
                  text = text.replace(old, new)
              result = text.encode('utf-8')
              if hashlib.sha256(result).hexdigest() != after:
                  raise RuntimeError('Unexpected result: ' + name)
              outputs[name] = result
          for name, data in outputs.items():
              pathlib.Path(name).write_bytes(data)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *outputs], check=True)
      - name: Commit before validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: honor source call stack lifetime and guard diagnostic output reads'
          git push origin HEAD:refs/heads/refactor/squirrel222-native-cpp-20260918
