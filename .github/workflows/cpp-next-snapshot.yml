name: C++ migration source baseline
on:
  push:
    branches: ['refactor/cpp-vm-boundaries-20260918']
    paths: ['.github/workflows/cpp-next-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive pinned baseline and Git metadata
        run: |
          mkdir -p snapshot
          git archive --format=tar.gz --output=snapshot/source.tar.gz f7d2f9dd46a5c4da5a8385d77abd876738c49ff6
          git bundle create snapshot/repository.bundle --all
          git rev-parse HEAD > snapshot/SNAPSHOT_REVISION.txt
          sha256sum snapshot/source.tar.gz snapshot/repository.bundle > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpp-migration-baseline-${{ github.sha }}
          retention-days: 14
          path: snapshot/
