name: Apply reviewed C++ binding checkpoint
on:
  push:
    branches: ['refactor/cpp-vm-boundaries-20260918']
    paths: ['.github/workflows/cpp-binding-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply only the reviewed files
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/refactor/cpp-vm-boundaries-20260918'
          raw = lzma.decompress(base64.b64decode(pathlib.Path('tools/migrations/cpp-binding-payload.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == 'e6d2dc80f21513c43a21dea6e8872d2ae0cfb1ce2bb9183a4f9fc516dc108160'
          manifest = json.loads(raw)
          allowed = {'.github/workflows/windows-x86.yml', 'CMakeLists.txt', 'include/kinoko/squirrel_binding.h', 'include/kinoko/squirrel_binding_detail.hpp', 'src/decompiled/6kinoko_rebuilt.c', 'src/squirrel/squirrel_class_binding.cpp', 'src/squirrel/squirrel_method_dispatch.cpp', 'src/squirrel/squirrel_native_arguments.cpp', 'src/squirrel/squirrel_native_variables.cpp', 'tests/squirrel_binding_contract.cpp'}
          assert {f['path'] for f in manifest['files']} == allowed
          for f in manifest['files']:
              p = pathlib.Path(f['path'])
              before = p.read_bytes() if p.exists() else b''
              assert (hashlib.sha256(before).hexdigest() if p.exists() else None) == f['before'], str(p)
              lines = before.decode('utf-8').splitlines(keepends=True)
              for edit in reversed(f['edits']):
                  lines[edit['start']:edit['end']] = [edit['text']]
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == f['after'], str(p)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(after)
          for path in ('tools/migrations/cpp-binding-payload.b64', '.github/workflows/cpp-binding-apply.yml', '.github/workflows/cpp-next-snapshot.yml'):
              pathlib.Path(path).unlink()
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'Poker'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'poker_sang@outlook.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'refactor: migrate 39 SqPlus class variable and method bindings to source C++', '-m', 'Source files verified against locally reviewed checkpoint fd968ba. Remove temporary source-transfer workflows and payload.'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/refactor/cpp-vm-boundaries-20260918'], check=True)
      - name: Preserve exact source checkpoint
        run: |
          mkdir -p snapshot
          git rev-parse HEAD > snapshot/SOURCE_REVISION.txt
          git rev-parse HEAD^{tree} > snapshot/SOURCE_TREE.txt
          git archive --format=tar.gz --output=snapshot/source.tar.gz HEAD
          git bundle create snapshot/repository.bundle --all
          sha256sum snapshot/source.tar.gz snapshot/repository.bundle > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpp-binding-source-${{ github.run_id }}
          retention-days: 14
          path: snapshot/
