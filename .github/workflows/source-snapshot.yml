name: Source snapshot
on:
  push:
    branches: ['refactor/squirrel222-native-cpp-20260918']
    paths: ['.github/workflows/source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record source and patch
        run: |
          git rev-parse HEAD > SOURCE_REVISION.txt
          git diff d773657e78f2be272984cefae76c568278a067db > SOURCE_CHANGES.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-source-${{ github.sha }}
          retention-days: 1
          path: |
            AGENTS.md
            CMakeLists.txt
            SOURCE_REVISION.txt
            SOURCE_CHANGES.patch
            include/
            src/
            tests/
            third_party/
            tools/
