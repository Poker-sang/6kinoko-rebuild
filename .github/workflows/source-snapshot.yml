name: Source snapshot
# Preserve the full starting revision for the next C++ migration validation batch.
on:
  push:
    branches: ['refactor/squirrel222-native-cpp-20260918']
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record complete tracked source and revision
        run: |
          mkdir -p snapshot
          git rev-parse HEAD > snapshot/SOURCE_REVISION.txt
          git archive --format=tar.gz --output=snapshot/source.tar.gz HEAD
          git log -30 --format='%H %s' > snapshot/COMMITS.txt
          sha256sum snapshot/source.tar.gz > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-source-${{ github.sha }}
          retention-days: 14
          path: snapshot/
