name: Source snapshot
# Preserve tracked source for reproducible native runtime validation.
on:
  push:
    branches: ['refactor/**']
    paths:
      - '.github/workflows/source-snapshot.yml'
      - 'docs/migration/**'
      - 'include/kinoko/compat/**'
      - 'src/reconstructed/archive_store.cpp'
      - 'src/reconstructed/file_io.cpp'
      - 'src/squirrel/script_file.cpp'
      - 'src/reconstructed/actor_pool.cpp'
      - 'cmake/migration-preflight/**'
      - 'tests/migration_compat_contract.cpp'
      - 'MIGRATION.md'
      - 'tools/migration/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record complete tracked source and revision
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git rev-parse HEAD > snapshot/SOURCE_REVISION.txt
          git ls-tree -r HEAD > snapshot/SOURCE_TREE.txt
          sha256sum src/decompiled/6kinoko.exe.c docs/decompiler-cleanup-r126/original-stage-evidence.json > snapshot/ORIGINAL_EVIDENCE_SHA256.txt
          git archive --format=tar.gz --output=snapshot/source.tar.gz HEAD
          git bundle create snapshot/source.bundle HEAD
          git log -30 --format='%H %s' > snapshot/COMMITS.txt
          base=$(git merge-base origin/master HEAD)
          git diff --numstat "$base" HEAD > snapshot/DIFF_NUMSTAT.txt
          # Record inherited whitespace diagnostics without blocking archival.
          git diff --check "$base" HEAD > snapshot/DIFF_CHECK.txt || test "$?" -eq 2
          (cd snapshot && sha256sum source.tar.gz source.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-source-${{ github.sha }}
          retention-days: 14
          path: snapshot/
