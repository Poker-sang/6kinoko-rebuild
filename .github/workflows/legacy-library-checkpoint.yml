name: Legacy library migration checkpoint
on:
  push:
    branches: [refactor/legacy-library-boundaries-20260920]
    paths:
      - .github/workflows/legacy-library-checkpoint.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact source and history
        run: |
          git rev-parse HEAD > source-commit.txt
          tar --exclude=./source-checkpoint.tar.gz -czf source-checkpoint.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-library-source-${{ github.sha }}
          path: |
            source-checkpoint.tar.gz
            source-commit.txt
          retention-days: 30
