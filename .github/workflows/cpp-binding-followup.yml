name: Apply binding edge tests checkpoint
on:
  push:
    branches: ['refactor/cpp-vm-boundaries-20260918']
    paths: ['.github/workflows/cpp-binding-followup.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply reviewed source delta
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/refactor/cpp-vm-boundaries-20260918'
          payload = pathlib.Path('tools/migrations/cpp-binding-followup.b64')
          raw = lzma.decompress(base64.b64decode(payload.read_text()))
          assert hashlib.sha256(raw).hexdigest() == '2663d7454cab1d834c10bd8883473cf7d9b8ca8975dab0141f08d838643055b3'
          manifest = json.loads(raw)
          allowed = {'include/kinoko/squirrel_binding.h', 'src/decompiled/6kinoko_rebuilt.c', 'src/squirrel/squirrel_class_binding.cpp', 'tests/squirrel_binding_contract.cpp'}
          assert {f['path'] for f in manifest['files']} == allowed
          for f in manifest['files']:
              path = pathlib.Path(f['path'])
              before = path.read_bytes()
              assert hashlib.sha256(before).hexdigest() == f['before'], str(path)
              lines = before.decode('utf-8').splitlines(keepends=True)
              for edit in reversed(f['edits']):
                  lines[edit['start']:edit['end']] = [edit['text']]
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == f['after'], str(path)
              path.write_bytes(after)
          payload.unlink()
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'Poker'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'poker_sang@outlook.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'test: cover native table mapped receiver and child VM bindings; prune 24 unused wrappers', '-m', 'File hashes verified against local reviewed checkpoint 891c625. Preserve Squirrel 2.2.2 statement grammar and report compile errors.'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/refactor/cpp-vm-boundaries-20260918'], check=True)
      - name: Preserve source checkpoint
        if: always()
        run: |
          mkdir -p snapshot
          git rev-parse HEAD > snapshot/SOURCE_REVISION.txt
          git archive --format=tar.gz --output=snapshot/source.tar.gz HEAD
          git bundle create snapshot/repository.bundle --all
          sha256sum snapshot/source.tar.gz snapshot/repository.bundle > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cpp-binding-followup-${{ github.run_id }}
          retention-days: 14
          path: snapshot/
