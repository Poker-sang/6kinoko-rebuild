name: Apply source VM migration
on:
  push:
    branches: ['refactor/squirrel222-native-cpp-20260918']
    paths: ['.github/workflows/vm-audit.yml']
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'Poker-sang/6kinoko-rebuild' && github.ref == 'refs/heads/refactor/squirrel222-native-cpp-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply the reviewed source edits
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          workflow = subprocess.check_output(['git','show','81956bf107bcbef476c8848a0c571cc9c2c96193:.github/workflows/vm-audit.yml'], text=True)
          script = workflow.split("python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          exec(compile(textwrap.dedent(script), 'checked-source-migration', 'exec'))
          PY
          git restore .github/workflows/windows-x86.yml
          git diff --check
          git diff --stat
      - name: Commit source changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src include CMakeLists.txt third_party/squirrel-2.2.2/squirrel/sqvm.cpp
          git commit -m 'refactor: make vendored Squirrel the VM execution and garbage-collection backend'
          git push origin HEAD:refs/heads/refactor/squirrel222-native-cpp-20260918
