name: VM migration audit
on:
  push:
    branches: ['refactor/squirrel222-native-cpp-20260918']
    paths: ['.github/workflows/vm-audit.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inventory VM definitions and boundary calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('src/decompiled/6kinoko_rebuilt.c').read_text(encoding='utf-8-sig')
          lines = s.splitlines()
          print('SOURCE',len(s),len(lines))
          defs=[]
          for i,line in enumerate(lines):
              m=re.search(r'^\S.*\b((?:FUN_|function_|sub_)[0-9a-fA-F]+)\s*\([^;]*\)\s*\{',line)
              if m:
                  defs.append((i,m.group(1)))
                  print(f'{i+1}: {line}')
          print('TOTAL DEFINITIONS',len(defs))
          print('=== EXECUTE ===')
          for i,line in enumerate(lines):
              if 'retdec_squirrel_execute_cpp(' in line:
                  for j in range(max(0,i-15),min(len(lines),i+25)):
                      print(f'{j+1}: {lines[j]}')
          print('=== VENDOR FILES ===')
          for p in Path('third_party').rglob('sqvm*'): print(p)
          print('=== THREAD ===')
          print(Path('src/squirrel/squirrel_thread.cpp').read_text(encoding='utf-8-sig'))
          print('=== CORE TARGET ===')
          cm=Path('CMakeLists.txt').read_text(encoding='utf-8-sig')
          print(cm)
          PY
