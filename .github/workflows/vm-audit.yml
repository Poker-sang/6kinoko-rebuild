name: VM migration audit
on:
  push:
    branches: ['refactor/squirrel222-native-cpp-20260918']
    paths: ['.github/workflows/vm-audit.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect VM dispatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('src/decompiled/6kinoko_rebuilt.c').read_text(encoding='utf-8-sig').splitlines()
          names=['kinoko_call_game_vm','kinoko_resume_game_vm','function_48a230','retdec_gc_object_type','retdec_squirrel_execute_cpp']
          defs=[]
          for i,line in enumerate(lines):
              if re.search(r'^\S.*\w+\s*\([^;]*\)\s*\{',line): defs.append(i)
          selected=set()
          for i,line in enumerate(lines):
              if any(n+'(' in line for n in names):
                  start=max((d for d in defs if d<=i),default=0)
                  end=next((d for d in defs if d>start),len(lines))
                  if end-start<=700: selected.add((start,end))
                  elif 'retdec_squirrel_execute_cpp(' in line: selected.add((i-25,i+65))
          for start,end in sorted(selected):
              print('\n===',start+1,end,'===')
              for i in range(start,end): print(f'{i+1}: {lines[i]}')
          for name in ['include/kinoko/squirrel_vm_bridge.h','third_party/squirrel-2.2.2/squirrel/sqvm.h']:
              print('\n=== FILE',name,'===')
              print(Path(name).read_text(encoding='utf-8-sig'))
          PY
