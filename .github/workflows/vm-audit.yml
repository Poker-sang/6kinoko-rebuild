name: VM migration audit
on:
  push:
    branches: ['refactor/squirrel222-native-cpp-20260918']
    paths: ['.github/workflows/vm-audit.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inventory original VM boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/decompiled/6kinoko_rebuilt.c')
          s = p.read_text(encoding='utf-8-sig')
          lines = s.splitlines()
          print('SOURCE', len(s), 'characters', len(lines), 'lines')
          print('=== HEADER ===')
          for i, line in enumerate(lines[:150], 1):
              print(f'{i}: {line}')
          for needle in ['retdec_squirrel_execute_cpp', 'Squirrel', 'KINOKO_ENABLE_SQUIRREL_CPP_VM']:
              print('\n=== CONTEXT', needle, '===')
              hits = [i for i, line in enumerate(lines) if needle in line]
              print('HITS', [i + 1 for i in hits])
              for i in hits[:12]:
                  for j in range(max(0, i - 14), min(len(lines), i + 28)):
                      print(f'{j+1}: {lines[j]}')
          print('\n=== FUNCTION DEFINITIONS ===')
          for i, line in enumerate(lines):
              if re.search(r'^\S.*\bfunction_[0-9a-fA-F]+\s*\([^;]*\)\s*\{', line):
                  print(f'{i+1}: {line}')
          PY
