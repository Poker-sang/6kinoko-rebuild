name: Apply Squirrel host migration
on:
  push:
    branches: ['refactor/squirrel222-native-cpp-20260918']
    paths: ['.github/workflows/squirrel-host-migration.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'Poker-sang/6kinoko-rebuild' && github.ref == 'refs/heads/refactor/squirrel222-native-cpp-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate all original and resulting source files before writing
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          parts = ['tools/migrations/squirrel-host-01.b64', 'tools/migrations/squirrel-host-02.b64']
          compressed = base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts), validate=True)
          if hashlib.sha256(compressed).hexdigest() != '950d5bc93ace02d786b2dea328ab737c25a7cbd10786455ca245e937ad1fcece':
              raise RuntimeError('Migration bundle checksum mismatch')
          bundle = json.loads(lzma.decompress(compressed))
          if bundle['base_files'].keys() != bundle['files'].keys():
              raise RuntimeError('Mismatched source set')
          outputs = {}
          for name, digest in bundle['base_files'].items():
              path = pathlib.Path(name)
              if path.is_absolute() or '..' in path.parts or name.startswith('.github/'):
                  raise RuntimeError('Disallowed source path')
              if digest is None:
                  if path.exists():
                      raise RuntimeError('Refusing to overwrite new file: ' + name)
                  lines = []
              else:
                  data = path.read_bytes()
                  if hashlib.sha256(data).hexdigest() != digest:
                      raise RuntimeError('Source changed since review: ' + name)
                  lines = data.decode('utf-8').splitlines(keepends=True)
              entry = bundle['files'][name]
              end_previous = 0
              for start, end, replacement in entry['edits']:
                  if not end_previous <= start <= end <= len(lines):
                      raise RuntimeError('Invalid edit range')
                  end_previous = end
              for start, end, replacement in reversed(entry['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              output = ''.join(lines).encode('utf-8')
              if hashlib.sha256(output).hexdigest() != entry['sha256']:
                  raise RuntimeError('Output checksum mismatch: ' + name)
              outputs[name] = output
          for name, data in outputs.items():
              path = pathlib.Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '-f', '--', *outputs], check=True)
          subprocess.run(['git', 'rm', '--', *parts], check=True)
      - name: Commit before tests and fast-forward the existing PR only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: migrate 43 Squirrel host object and native argument functions to source C++'
          git push origin HEAD:refs/heads/refactor/squirrel222-native-cpp-20260918
          git rev-parse HEAD
