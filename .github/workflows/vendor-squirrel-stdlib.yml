name: Recover pinned Squirrel standard library
on:
  push:
    branches: ['refactor/squirrel222-native-cpp-20260918']
    paths: ['.github/workflows/vendor-squirrel-stdlib.yml']
permissions:
  contents: write
jobs:
  vendor:
    if: github.repository == 'Poker-sang/6kinoko-rebuild'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
      - name: Recover only omitted standard-library source files
        run: |
          curl --fail --location --retry 3 --max-time 90 'https://downloads.sourceforge.net/project/squirrel/squirrel2/squirrel%202.2.2%20stable/squirrel_2.2.2_stable.tar.gz' -o /tmp/squirrel222.tar.gz
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path, PurePosixPath
          archive = Path('/tmp/squirrel222.tar.gz')
          expected = json.loads(Path('analysis/function-inventory-20260917/squirrel-source-verification.json').read_text())['archive_sha256']
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Original source archive SHA256 mismatch'
          root = Path('third_party/squirrel-2.2.2')
          entries = []
          with tarfile.open(archive) as tf:
              for member in tf.getmembers():
                  parts = PurePosixPath(member.name).parts
                  if not member.isfile() or len(parts) != 3 or parts[1] != 'sqstdlib' or Path(parts[2]).suffix not in ('.h', '.cpp'):
                      continue
                  relative = Path('sqstdlib') / parts[2]
                  destination = root / relative
                  assert not destination.exists(), str(destination)
                  data = tf.extractfile(member).read()
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  entries.append({'file':relative.as_posix(), 'sha256':hashlib.sha256(data).hexdigest()})
          assert len(entries) >= 10, entries
          (root/'sqstdlib-provenance.json').write_text(json.dumps({'archive':'squirrel_2.2.2_stable.tar.gz','archive_sha256':expected,'files':entries}, indent=2)+'\n')
          print(json.dumps(entries, indent=2))
          PY
      - name: Commit recovered source and remove one-time delivery workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/vendor-squirrel-stdlib.yml
          git add third_party/squirrel-2.2.2/sqstdlib third_party/squirrel-2.2.2/sqstdlib-provenance.json
          git commit -m 'vendor: add byte-identical Squirrel 2.2.2 standard library; preserve core sources'
          git push origin HEAD:refactor/squirrel222-native-cpp-20260918
          mkdir -p snapshot
          git rev-parse HEAD > snapshot/SOURCE_REVISION.txt
          git archive --format=tar.gz --output=snapshot/source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: squirrel-stdlib-source-${{ github.sha }}
          retention-days: 14
          path: snapshot/
