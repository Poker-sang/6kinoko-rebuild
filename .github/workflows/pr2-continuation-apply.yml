name: Apply reviewed PR2 continuation
on:
  push:
    branches: ['refactor/sqrat-native-cpp-20260918']
    paths: ['.github/workflows/pr2-continuation-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reconcile reviewed source and apply exact file hashes
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, re, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/refactor/sqrat-native-cpp-20260918'
          def git(*args, check=True):
              return subprocess.run(['git', *args], check=check, text=True, capture_output=True)
          git('config', 'user.name', 'Poker')
          git('config', 'user.email', 'poker_sang@outlook.com')
          git('branch', 'current-master', '826b98421aa304f9ddc5c22efbac9a61eb6db5ba')
          result = git('merge', '--no-commit', '--no-ff', 'current-master', check=False)
          assert result.returncode == 1, result.stdout + result.stderr
          conflicts = set(git('diff', '--name-only', '--diff-filter=U').stdout.splitlines())
          assert conflicts == {'CMakeLists.txt', 'src/decompiled/6kinoko_rebuilt.c', '.github/workflows/windows-x86.yml'}, conflicts
          for name in ('CMakeLists.txt', 'src/decompiled/6kinoko_rebuilt.c'):
              path = pathlib.Path(name)
              def resolve(match):
                  ours, theirs = match.group(1), match.group(2)
                  if name == 'CMakeLists.txt' and 'kinoko_squirrel_host_object_contract' in ours:
                      return ours + '    kinoko_squirrel_binding_contract\n'
                  return ours + theirs
              text = re.sub(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> current-master\n', resolve, path.read_text(), flags=re.S)
              assert '<<<<<<< HEAD' not in text
              path.write_text(text)
          # Actions may write source, but workflow edits are performed separately
          # by the authorized connector. Never request additional token scopes.
          git('checkout', '--ours', '.github/workflows/windows-x86.yml')
          git('add', '-A')
          git('merge', '--quit')
          payload = pathlib.Path('tools/migrations/pr2-continuation.b64')
          raw = lzma.decompress(base64.b64decode(payload.read_text()))
          assert hashlib.sha256(raw).hexdigest() == '66acabb6a7d4583c09731e9b9892ac46cd02c37f0449d71b7249fde5d9207d3e'
          manifest = json.loads(raw)
          allowed = {'CMakeLists.txt', 'include/kinoko/squirrel_game_objects.h', 'include/kinoko/squirrel_native_calls.h', 'src/decompiled/6kinoko_rebuilt.c', 'src/squirrel/squirrel_game_objects.cpp', 'src/squirrel/squirrel_native_calls.cpp', 'src/squirrel/squirrel_table_values.cpp', 'tests/squirrel_game_objects_contract.cpp', 'tests/squirrel_native_calls_contract.cpp'}
          assert {f['path'] for f in manifest['files']} == allowed
          for f in manifest['files']:
              path = pathlib.Path(f['path'])
              before = path.read_bytes() if path.exists() else b''
              assert (hashlib.sha256(before).hexdigest() if path.exists() else None) == f['before'], str(path)
              lines = before.decode('utf-8').splitlines(keepends=True)
              for edit in reversed(f['edits']):
                  lines[edit['start']:edit['end']] = [edit['text']]
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == f['after'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
          payload.unlink()
          git('add', '-A')
          git('diff', '--cached', '--check')
          assert not git('diff', '--cached', '--name-only', '--', '.github/workflows').stdout.strip()
          print(git('commit', '-m', 'refactor: continue PR2 with 34 source C++ native call and ACT object functions', '-m', 'Preserve reviewed PR2 bridges and integrate source changes from master 826b984. Exact source deltas verified against local checkpoint 6245953; workflow union and master ancestry are recorded separately.').stdout)
          print(git('push', 'origin', 'HEAD:refs/heads/refactor/sqrat-native-cpp-20260918').stderr)
      - name: Preserve exact source for validation
        if: always()
        run: |
          mkdir -p snapshot
          git rev-parse HEAD > snapshot/SOURCE_REVISION.txt
          git rev-parse HEAD^{tree} > snapshot/SOURCE_TREE.txt
          git bundle create snapshot/repository.bundle --all
          sha256sum snapshot/repository.bundle > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr2-continuation-checkpoint-${{ github.run_id }}
          retention-days: 14
          path: snapshot/
