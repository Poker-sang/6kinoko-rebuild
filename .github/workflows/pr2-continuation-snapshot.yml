name: PR2 continuation source snapshot
on:
  push:
    branches: ['refactor/sqrat-native-cpp-20260918']
    paths: ['.github/workflows/pr2-continuation-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve repository and pinned revisions
        run: |
          mkdir -p snapshot
          git bundle create snapshot/repository.bundle --all
          git rev-parse HEAD > snapshot/SOURCE_REVISION.txt
          git rev-parse origin/master > snapshot/MASTER_REVISION.txt
          sha256sum snapshot/repository.bundle > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr2-continuation-source-${{ github.run_id }}
          retention-days: 14
          path: snapshot/
