name: Migration preflight (compile only)
on:
  push:
    branches: [master, 'refactor/**']
    paths:
      - '.github/workflows/migration-preflight.yml'
      - 'MIGRATION.md'
      - 'CMakeLists.txt'
      - 'docs/migration/**'
      - 'tools/migration/**'
      - 'tools/audit_readability.py'
      - 'cmake/migration-preflight/**'
      - 'src/**'
      - 'include/**'
      - 'tests/migration_compat_contract.cpp'
      - 'tests/act_layer_storage_contract.cpp'
      - 'tests/test_readability_inventory.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check handoff references and compile extracted rules (no execution)
        shell: bash
        run: |
          set -euo pipefail
          build="build-runs/migration-preflight-${{ github.run_id }}"
          mkdir -p "$build"
          git rev-parse HEAD > "$build/source-commit.txt"
          python tools/migration/check_source_map.py --output "$build/source-map-report.json"
          python -m py_compile tools/audit_readability.py tests/test_readability_inventory.py
          python tools/audit_readability.py --source-ref "${{ github.sha }}" --scope project --output "$build/readability.json" > "$build/readability-summary.log"
          extra=(-DCMAKE_BUILD_TYPE=Release)
          if [ "$RUNNER_OS" = Windows ]; then extra=(-A x64); fi
          cmake -S cmake/migration-preflight -B "$build" "${extra[@]}" \
            -DKINOKO_MIGRATION_REGISTER_TESTS=OFF 2>&1 | tee "$build/configure.log"
          cmake --build "$build" --config Release --parallel 2 2>&1 | tee "$build/build.log"
          # Do not run ctest or the contract executable: execution is user-owned.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: migration-preflight-${{ matrix.os }}-${{ github.sha }}
          retention-days: 14
          path: |
            build-runs/migration-preflight-${{ github.run_id }}/*.log
            build-runs/migration-preflight-${{ github.run_id }}/*.json
            build-runs/migration-preflight-${{ github.run_id }}/source-commit.txt
