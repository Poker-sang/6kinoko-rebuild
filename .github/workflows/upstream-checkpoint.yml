name: Upstream source checkpoint
on:
  push:
    branches: [refactor/upstream-libraries-20260920]
    paths: [tools/upstream-payload.json, .github/workflows/upstream-checkpoint.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: upstream-source-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: refactor/upstream-libraries-20260920
      - name: Apply checked source commits
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib, subprocess
          def git(*args, **kwargs):
              return subprocess.run(['git', *args], check=True, **kwargs)
          path = pathlib.Path('tools/upstream-payload.json')
          payload = json.loads(path.read_text())
          git('merge-base', '--is-ancestor', payload['baseline'], 'HEAD')
          git('config', 'user.name', 'OpenAI')
          git('config', 'user.email', 'noreply@openai.com')
          for commit in payload['commits']:
              encoded = commit['patch']
              if hashlib.sha256(encoded.encode()).hexdigest() == '83e6c6dffb31bfaba3f176de45dc9ec4d00c680ea673ca97a4c1a6c05d33f529':
                  for bad, good in [
                      ('Yb5mmn+k/sF7D6YYWDCGGJCqrLwbjElAeSSeTNiy1', 'Yb5mmn+k/sF7D6YYWDCGJCqrLwbjElAeSSeTNiy1'),
                      ('bvM/dqwWPbUXF2QZtqi+UUeF0/MsKWWuF41Fqd8sE', 'bvM/dqwWPbUXF2QZtqi+UeF0/MsKWWuF41Fqd8sE'),
                      ('H8O3/tu0BkLfN8Gp/XWeRRkg5IBLxnXqxlVbwfH/S', 'H8O3/tu0BkLfN8Gp/XWeRkg5IBLxnXqxlVbwfH/S'),
                      ('A1MuDNxOhNYsI7f7/ShcWnNzsDHLPjO7A+sVK9M+w', 'A1MuDNxOhNYsI7f7/ShcwDnNzsDHLPjO7A+sVK9M+w')]:
                      assert encoded.count(bad) == 1
                      encoded = encoded.replace(bad, good)
                  assert hashlib.sha256(encoded.encode()).hexdigest() == '06db191d1799b6eb7232ef516870fd556b3578a811b1f322618bfc33cc1f5531'
              patch = gzip.decompress(base64.b64decode(encoded, validate=True))
              git('apply', '--exclude=.github/workflows/*', '--index', '--check', '--binary', '-', input=patch)
              git('apply', '--exclude=.github/workflows/*', '--index', '--binary', '-', input=patch)
              if commit.get('vendor'):
                  script = {'audio': 'tools/vendor_audio_sources.py', 'bindings': 'tools/vendor_binding_sources.py'}[commit['vendor']]
                  subprocess.run(['python', script], check=True)
                  git('add', 'third_party')
              git('commit', '-m', commit['message'])
          git('rm', str(path))
          git('commit', '-m', 'chore: remove applied checkpoint payload')
          with open('source-commit.txt', 'w') as f:
              git('rev-parse', 'HEAD', stdout=f)
          git('bundle', 'create', 'source.bundle', 'HEAD')
          git('push', 'origin', 'HEAD:refactor/upstream-libraries-20260920')
      - name: Validate published revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-x86.yml --ref refactor/upstream-libraries-20260920
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-checkpoint-${{ github.run_id }}
          path: |
            source.bundle
            source-commit.txt
            tools/upstream-payload.json
          retention-days: 30
