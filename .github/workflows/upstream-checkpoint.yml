name: Upstream source checkpoint
on:
  push:
    branches: [refactor/upstream-libraries-20260920]
    paths: [.github/workflows/upstream-checkpoint.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture repository without credentials
        run: |
          mkdir -p checkpoint
          git bundle create checkpoint/source.bundle --all
          git rev-parse HEAD > checkpoint/source-commit.txt
      - name: Fetch candidate release archives for inspection only
        shell: bash
        run: |
          set -euo pipefail
          cd checkpoint
          curl -fL --retry 2 --max-time 90 https://downloads.xiph.org/releases/vorbis/libvorbis-1.2.0.tar.gz -o libvorbis-1.2.0.tar.gz
          echo '6eb7040048e35448fe224fa3fd993eb4e49a905c57893886082f1674d43b0e73  libvorbis-1.2.0.tar.gz' | sha256sum -c
          curl -fL --retry 2 --max-time 90 https://downloads.xiph.org/releases/ogg/libogg-1.1.3.tar.gz -o libogg-1.1.3.tar.gz
          echo 'bae29e79fbc50bbedf1235852094b71c8c910a1ef0cd42fe4163b7b545630b65  libogg-1.1.3.tar.gz' | sha256sum -c
          curl -fL --retry 2 --max-time 90 'https://downloads.sourceforge.net/project/scrat/Sqrat/Sqrat%200.8/sqrat_0.8.1.zip' -o sqrat_0.8.1.zip || true
          curl -fL --retry 2 --max-time 90 'https://sourceforge.net/projects/sqplus/files/latest/download' -o sqplus-candidate.zip || true
          curl -fL --retry 2 --max-time 120 https://archives.boost.io/release/1.44.0/source/boost_1_44_0.tar.bz2 -o boost_1_44_0.tar.bz2 || true
          sha256sum *.gz *.zip *.bz2 > downloaded-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-source-checkpoint
          path: checkpoint/
          retention-days: 30
