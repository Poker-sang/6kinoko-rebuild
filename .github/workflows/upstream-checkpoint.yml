name: Upstream source checkpoint
on:
  push:
    branches: [refactor/upstream-libraries-20260920]
    paths: [tools/upstream-payload.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: upstream-source-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: refactor/upstream-libraries-20260920
      - name: Apply checked source commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib, subprocess, tempfile, zipfile
          def git(*args, **kwargs):
              return subprocess.run(['git', *args], check=True, **kwargs)
          path = pathlib.Path('tools/upstream-payload.json')
          payload = json.loads(path.read_text())
          git('merge-base', '--is-ancestor', payload['baseline'], 'HEAD')
          git('config', 'user.name', 'OpenAI')
          git('config', 'user.email', 'noreply@openai.com')
          for commit in payload['commits']:
              if commit.get('retire'):
                  assert commit['retire'] == 'zlib-stl-268'
                  with tempfile.TemporaryDirectory() as temporary:
                      maps = []
                      for mode, artifact, digest in [
                          ('quiet', 10598685684, '2fc70fbf23c046dd7501bfb67e35fd40f25e8fcb994ad45682ce28d61afdf528'),
                          ('diagnostic', 10598740623, '4f2cdb3cf252453f2cb263130d5eb03df2b3ab9c59fba0fac34eb37d7bb37503')]:
                          data = subprocess.run(['gh', 'api', f'repos/${{ github.repository }}/actions/artifacts/{artifact}/zip'], check=True, capture_output=True).stdout
                          assert hashlib.sha256(data).hexdigest() == digest
                          archive = pathlib.Path(temporary) / (mode + '.zip')
                          archive.write_bytes(data)
                          with zipfile.ZipFile(archive) as z:
                              for member in [f'build-runs/ci-{mode}/{name}' for name in ['source-commit.txt', 'kinoko.map', 'stage-contract.map']]:
                                  z.extract(member, pathlib.Path(temporary) / mode)
                          directory = pathlib.Path(temporary) / mode / 'build-runs' / ('ci-' + mode)
                          maps.extend(['--map', str(directory / 'kinoko.map'), '--map', str(directory / 'stage-contract.map')])
                      subprocess.run(['python', 'tools/upstream_retire_step.py', *maps], check=True)
                  git('add', 'src/decompiled/6kinoko_rebuilt.c', 'docs/upstream-library-audit/retired-zlib-stl.json')
              else:
                  patch = gzip.decompress(base64.b64decode(commit['patch'], validate=True))
                  git('apply', '--exclude=.github/workflows/*', '--index', '--check', '--binary', '-', input=patch)
                  git('apply', '--exclude=.github/workflows/*', '--index', '--binary', '-', input=patch)
              git('commit', '-m', commit['message'])
          git('rm', str(path))
          if pathlib.Path('tools/upstream_retire_step.py').exists():
              git('rm', 'tools/upstream_retire_step.py')
          git('commit', '-m', 'chore: remove applied checkpoint transport')
          with open('source-commit.txt', 'w') as f:
              git('rev-parse', 'HEAD', stdout=f)
          git('bundle', 'create', 'source.bundle', 'HEAD')
          git('push', 'origin', 'HEAD:refactor/upstream-libraries-20260920')
      - name: Validate published revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-x86.yml --ref refactor/upstream-libraries-20260920
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-checkpoint-${{ github.run_id }}
          path: |
            source.bundle
            source-commit.txt
            tools/upstream-payload.json
          retention-days: 30
