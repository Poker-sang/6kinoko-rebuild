name: Upstream source checkpoint
on:
  push:
    branches: [refactor/upstream-libraries-20260920]
    paths: [tools/upstream-payload.json, .github/workflows/upstream-checkpoint.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: upstream-source-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: refactor/upstream-libraries-20260920
      - name: Apply checked source commits
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib, subprocess
          def git(*args, **kwargs):
              return subprocess.run(['git', *args], check=True, **kwargs)
          path = pathlib.Path('tools/upstream-payload.json')
          payload = json.loads(path.read_text())
          git('merge-base', '--is-ancestor', payload['baseline'], 'HEAD')
          git('config', 'user.name', 'OpenAI')
          git('config', 'user.email', 'noreply@openai.com')
          for commit in payload['commits']:
              encoded = commit['patch']
              if hashlib.sha256(encoded.encode()).hexdigest() == 'd61c9ee8e43d3196a67c5f464f481c5364fcaa057408b5d6585f56c60adc5287':
                  assert encoded.count('NXidVZrkZA') == 1
                  encoded = encoded.replace('NXidVZrkZA', 'NXidVrkZA')
                  assert hashlib.sha256(encoded.encode()).hexdigest() == '6fd74790353bcfa9713c413138a8ae387c9429be43bad168ce8fd21d3012c493'
              patch = gzip.decompress(base64.b64decode(encoded, validate=True))
              git('apply', '--exclude=.github/workflows/*', '--index', '--check', '--binary', '-', input=patch)
              git('apply', '--exclude=.github/workflows/*', '--index', '--binary', '-', input=patch)
              if commit.get('vendor'):
                  script = {'audio': 'tools/vendor_audio_sources.py', 'bindings': 'tools/vendor_binding_sources.py'}[commit['vendor']]
                  subprocess.run(['python', script], check=True)
                  git('add', 'third_party')
              git('commit', '-m', commit['message'])
          git('rm', str(path))
          git('commit', '-m', 'chore: remove applied checkpoint payload')
          with open('source-commit.txt', 'w') as f:
              git('rev-parse', 'HEAD', stdout=f)
          git('bundle', 'create', 'source.bundle', 'HEAD')
          git('push', 'origin', 'HEAD:refactor/upstream-libraries-20260920')
      - name: Validate published revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-x86.yml --ref refactor/upstream-libraries-20260920
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-checkpoint-${{ github.run_id }}
          path: |
            source.bundle
            source-commit.txt
            tools/upstream-payload.json
          retention-days: 30
