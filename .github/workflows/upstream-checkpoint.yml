name: Upstream source checkpoint
on:
  push:
    branches: [refactor/upstream-libraries-20260920]
    paths: [tools/upstream-payload.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: upstream-source-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: refactor/upstream-libraries-20260920
      - name: Apply checked source commits
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib, subprocess
          def git(*args, **kwargs):
              return subprocess.run(['git', *args], check=True, **kwargs)
          def blob(data):
              return git('hash-object', '--stdin', input=data, capture_output=True).stdout.decode().strip()
          path = pathlib.Path('tools/upstream-payload.json')
          payload = json.loads(path.read_text())
          if 'gzip_b64' in payload:
              decoded = gzip.decompress(base64.b64decode(payload['gzip_b64'], validate=True))
              assert hashlib.sha256(decoded).hexdigest() == payload['sha256']
              payload = json.loads(decoded)
          git('merge-base', '--is-ancestor', payload['baseline'], 'HEAD')
          git('config', 'user.name', 'OpenAI')
          git('config', 'user.email', 'noreply@openai.com')
          for commit in payload['commits']:
              for edit in commit['files']:
                  file = pathlib.Path(edit['path'])
                  assert not file.is_absolute() and '..' not in file.parts
                  assert file.parts[0] in {'src', 'include', 'tests', 'tools', 'third_party', 'docs', 'cmake', 'CMakeLists.txt'}
                  data = file.read_bytes() if file.exists() else b''
                  assert blob(data) == edit['before'], str(file) + ': unexpected source'
                  text = data.decode('utf-8')
                  for replacement in edit.get('replacements', []):
                      old, new, count = replacement
                      assert text.count(old) == count, str(file) + ': replacement count'
                      text = text.replace(old, new)
                  if 'content' in edit:
                      text = edit['content']
                  result = text.encode('utf-8')
                  assert blob(result) == edit['after'], str(file) + ': result checksum'
                  file.parent.mkdir(parents=True, exist_ok=True)
                  file.write_bytes(result)
                  git('add', str(file))
              git('commit', '-m', commit['message'])
          git('rm', str(path))
          git('commit', '-m', 'chore: remove applied checkpoint transport')
          with open('source-commit.txt', 'w') as f:
              git('rev-parse', 'HEAD', stdout=f)
          git('bundle', 'create', 'source.bundle', 'HEAD')
          git('push', 'origin', 'HEAD:refactor/upstream-libraries-20260920')
      - name: Validate published revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-x86.yml --ref refactor/upstream-libraries-20260920
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-checkpoint-${{ github.run_id }}
          path: |
            source.bundle
            source-commit.txt
            tools/upstream-payload.json
          retention-days: 30
