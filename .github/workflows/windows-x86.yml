name: Windows x86

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        trace: [quiet, diagnostic]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select installed MSVC x86 tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'An installed MSVC x86 toolchain is required.' }
          $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $batch = Join-Path $env:RUNNER_TEMP 'kinoko-msvc-x86.cmd'
          @('@echo off', "call `"$devcmd`" -no_logo -host_arch=x64 -arch=x86 >nul", 'if errorlevel 1 exit /b 1', 'set') | Set-Content -Encoding ascii $batch
          $environment = & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd failed.' }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name, $value = $Matches[1], $Matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|CI$)') { "$name=$value" >> $env:GITHUB_ENV }
            }
          }
      - name: Record source revision
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-runs/ci-${{ matrix.trace }} | Out-Null
          git rev-parse HEAD | Set-Content build-runs/ci-${{ matrix.trace }}/source-commit.txt
      - name: Configure Win32
        shell: pwsh
        run: |
          $quiet = if ('${{ matrix.trace }}' -eq 'quiet') { 'ON' } else { 'OFF' }
          cmake -S . -B build-runs/ci-${{ matrix.trace }} -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DKINOKO_RETDEC_DISABLE_TRACE=$quiet `
            -DKINOKO_RETDEC_TRACE_FILTER=ON `
            -DKINOKO_REFERENCE_DIR="${{ github.workspace }}/ci-no-proprietary-assets" `
            -DKINOKO_RUNTIME_DIR="${{ github.workspace }}/runtime-builds/ci-${{ matrix.trace }}" `
            2>&1 | Tee-Object build-runs/ci-${{ matrix.trace }}/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build all targets
        shell: pwsh
        run: |
          cmake --build build-runs/ci-${{ matrix.trace }} --config Release --parallel 4 `
            2>&1 | Tee-Object build-runs/ci-${{ matrix.trace }}/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage authenticated legacy DirectX runtime
        shell: pwsh
        run: |
          ./tools/prepare_ci_directx.ps1 -Destination "$env:RUNNER_TEMP/kinoko-directx-x86" `
            2>&1 | Tee-Object build-runs/ci-${{ matrix.trace }}/directx.log
      - name: Asset-free contracts
        shell: pwsh
        run: |
          ctest --test-dir build-runs/ci-${{ matrix.trace }} -C Release --output-on-failure --no-tests=error --timeout 120 `
            -R '^(stage_native_contract|damage_pause_contract|game_math_contract|legacy_abi_contract|texture_store_contract|diagnostics_capture|squirrel_source_vm_contract|legacy_method_entries_contract|retdec_memory_contract|diagnostics_filter_contract|squirrel_refcount_contract|squirrel_host_object_contract|sqrat_object_contract|native_property_contract)$' `
            2>&1 | Tee-Object build-runs/ci-${{ matrix.trace }}/ctest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve diagnostics and binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x86-${{ matrix.trace }}-${{ github.sha }}
          retention-days: 14
          path: |
            build-runs/ci-${{ matrix.trace }}/*.log
            build-runs/ci-${{ matrix.trace }}/source-commit.txt
            build-runs/ci-${{ matrix.trace }}/Testing/Temporary/
            runtime-builds/ci-${{ matrix.trace }}/
