name: Sqrat work source snapshot
on:
  push:
    branches: ['work/sqrat-cpp-20260918']
    paths: ['.github/workflows/sqrat-work-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'Poker-sang/6kinoko-rebuild'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 06ad4bf1aafd817fc5bc75305d3c1ef0ab33c047
          persist-credentials: false
      - name: Export the exact existing PR code, without modifying it
        run: |
          mkdir -p snapshot
          git rev-parse HEAD > snapshot/SOURCE_REVISION.txt
          git archive --format=tar.gz --output=snapshot/source.tar.gz HEAD
          sha256sum snapshot/source.tar.gz > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sqrat-source-06ad4bf
          retention-days: 14
          path: snapshot/
