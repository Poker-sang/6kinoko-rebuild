name: PR7 migration checkpoint
on:
  push:
    branches: [refactor/upstream-libraries-20260920]
    paths: [tools/pr7-migration-step.py]
permissions:
  contents: write
  actions: write
concurrency:
  group: pr7-migration-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refactor/upstream-libraries-20260920
          fetch-depth: 0
      - name: Apply guarded migration and commit before testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f tools/pr7-migration-step.py
          git config user.name OpenAI
          git config user.email noreply@openai.com
          message=$(sed -n 's/^# commit: //p' tools/pr7-migration-step.py | head -1)
          test -n "$message"
          python tools/pr7-migration-step.py
          git diff --check
          git add src include tests tools docs CMakeLists.txt
          git rm tools/pr7-migration-step.py
          git commit -m "$message"
          git rev-parse HEAD > source-commit.txt
          git bundle create pr7-source.bundle HEAD
          git push origin HEAD:refactor/upstream-libraries-20260920
      - name: Validate migration boundaries and provenance
        run: |
          python tools/check_migration_boundaries.py
          python -m unittest discover -s tests -p test_legacy_islands.py -v
          python -m unittest discover -s tests -p test_upstream_provenance.py -v
      - name: Dispatch quiet Win32 verification of committed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-x86.yml --ref refactor/upstream-libraries-20260920
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr7-checkpoint-${{ github.run_id }}
          retention-days: 30
          path: |
            pr7-source.bundle
            source-commit.txt
