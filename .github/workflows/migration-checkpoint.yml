name: Migration checkpoint
on:
  push:
    branches: [refactor/no-inline-asm-cpp-20260919]
    paths:
      - .github/workflows/migration-checkpoint.yml
      - tools/migration-checkpoint.py
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: refactor/no-inline-asm-cpp-20260919
      - name: Apply reviewed migration batch
        run: |
          if test -f tools/migration-checkpoint.py; then
            python3 tools/migration-checkpoint.py
            # Runner credentials cannot edit workflows. Workflow changes are
            # made separately through the authorized GitHub connection.
            git restore -- .github/workflows/windows-x86.yml
            if test -f analysis/no-inline-asm-20260919/removed-definitions.json && ! test -f docs/no-inline-asm-20260919/removed-definitions.json; then
              mkdir -p docs/no-inline-asm-20260919
              cp analysis/no-inline-asm-20260919/removed-definitions.json docs/no-inline-asm-20260919/
            fi
            git config user.name 'Poker-sang'
            git config user.email '62325494+Poker-sang@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'refactor: apply reviewed C++ migration checkpoint'
              git push origin HEAD:refactor/no-inline-asm-cpp-20260919
            fi
          fi
      - name: Export exact source checkpoint
        if: always()
        run: |
          git rev-parse HEAD > source-commit.txt
          git bundle create /tmp/migration-source.bundle HEAD refs/remotes/origin/master
          cp /tmp/migration-source.bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: migration-source-${{ github.run_number }}
          path: |
            migration-source.bundle
            source-commit.txt
          retention-days: 30
