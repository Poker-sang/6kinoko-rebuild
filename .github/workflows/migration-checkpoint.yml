name: Migration checkpoint
on:
  push:
    branches: [refactor/typed-native-runtime-20260919]
    paths:
      - .github/workflows/migration-checkpoint.yml
      - tools/migration-checkpoint.py
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: refactor/typed-native-runtime-20260919
      - name: Apply reviewed migration batch
        run: |
          python3 tools/migration-checkpoint.py
          # Workflow updates are submitted separately by the authorized user.
          git restore --source=HEAD -- .github/workflows/windows-x86.yml
          python3 tools/check_migration_boundaries.py
          git diff --check
          git config user.name 'Poker-sang'
          git config user.email '62325494+Poker-sang@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: apply verified native runtime migration batch'
          git push origin HEAD:refactor/typed-native-runtime-20260919
